[metadata]
name = monitorinbox2kuma
version = 0.1.0
description = Poll a Microsoft 365 mailbox for Synology backup emails and push the result to Uptime Kuma.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    msal>=1.32.0,<2.0.0
    python-socketio[client]>=5.11.0,<6.0.0
    python-dotenv>=1.0.1,<2.0.0
    requests>=2.32.0,<3.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    monitorinbox2kuma = monitorinbox2kuma.main:main

[options.extras_require]
dev =
    pytest>=8.3.0,<9.0.0
